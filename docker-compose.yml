name: wigate-microtik

services:
  app:
    build: .
    image: wigate-microtik:latest
    container_name: wigate-microtik
    ports:
      - "${PORT:-8080}:8000"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      USERNAME_PREFIX: ${USERNAME_PREFIX:-acb-}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
